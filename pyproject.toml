[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micp-lca"
version = "0.1.0"
description = "Ex-ante life-cycle assessment of MICP-based recycling of waste concrete fines and sub-sieve demolition residues (EN 15804+A2 / EF 3.1)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CTU Prague, Faculty of Civil Engineering – MICP research group"}]
keywords = ["LCA", "MICP", "biocementation", "waste concrete fines", "EN 15804", "Environmental Footprint"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "matplotlib>=3.7",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl>=3.1", "streamlit>=1.40", "plotly>=5.20", "pypdf>=4"]
app = ["streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
micp-lca = "micp_lca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
