# ---------------------------------------------------------------------------------------------
# Additional reagents and alternative nutrient sources from the wider MICP literature
# (Porter et al. 2021; Nežerka et al. 2023 review; van Paassen et al. 2010; Alotaibi et al. 2022)

calcium_acetate:
  name: Calcium acetate (anhydrous, from petrochemical acetic acid)
  formula: Ca(CH3COO)2
  molar_mass: 158.17
  calcium_content: 0.2534
  carbon_content: 0.3038
  carbon_origin: fossil          # switch to 'biogenic' for bio-derived acetic acid (Choi et al. 2017)
  background_process: calcium_acetate
  notes: "Organic-acid oxidation route: Ca(CH3COO)2 + 4 O2 -> CaCO3 + 3 CO2 + 3 H2O (1/4 of the carbon fixed)."

calcium_acetate_bio:
