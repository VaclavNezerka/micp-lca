# Chemicals, media components and reagents used in the MICP protocols.
# Units: molar_mass in g/mol; element contents in kg element per kg substance (as purchased form).
# carbon_origin: fossil | biogenic | geogenic (mineral carbonate) | none
# background_process: id of the cradle-to-gate background dataset (data/background/background_processes.csv)
#
# Element contents are used by the chemistry module for stoichiometric CaCO3 yields, the carbon
# balance (urea-C is fossil, lactate-C is biogenic, CaCO3-C from limestone is geogenic) and the
# nitrogen balance (NH3/NH4+ by-products of ureolysis).

urea:
  name: Urea (technical grade, prills)
  formula: CO(NH2)2
  molar_mass: 60.06
  carbon_content: 0.2000
  carbon_origin: fossil          # CO2 captured from the ammonia plant and bound in urea (Fertilizers Europe 2018)
  nitrogen_content: 0.4665
  background_process: urea_EU
  notes: "Hydrolysis releases 0.733 kg CO2 per kg urea (IPCC 2019 urea EF 0.20 kg C/kg) unless the carbon is precipitated as CaCO3."

calcium_chloride:
  name: Calcium chloride (anhydrous, technical grade)
  formula: CaCl2
  molar_mass: 110.98
  calcium_content: 0.3612
  chloride_content: 0.6388
  carbon_origin: none
  background_process: calcium_chloride_industrial
  notes: "Papers dose 2.8 g/L CaCl2 (assumed anhydrous, 25.2 mmol Ca/L)."

calcium_lactate_pentahydrate:
  name: Calcium lactate pentahydrate (food grade)
  formula: Ca(C3H5O3)2.5H2O
  molar_mass: 308.30
  calcium_content: 0.1300
  carbon_content: 0.2338
  carbon_origin: biogenic        # lactic acid from sugar fermentation
  background_process: calcium_lactate_pentahydrate
  notes: "Papers dose 11.0 g/L (35.7 mmol Ca/L). Oxidation: Ca(C3H5O3)2 + 6 O2 -> CaCO3 + 5 CO2 + 5 H2O, i.e. 1/6 of the lactate carbon can be fixed as CaCO3."

sodium_chloride:
  name: Sodium chloride (saline 9 g/L, LB, NB, TSB component)
  formula: NaCl
  molar_mass: 58.44
  chloride_content: 0.6066
  carbon_origin: none
  background_process: sodium_chloride

sodium_bicarbonate:
  name: Sodium hydrogen carbonate (sesquicarbonate buffer component)
  formula: NaHCO3
  molar_mass: 84.01
  carbon_content: 0.1430
  carbon_origin: geogenic
  background_process: sodium_bicarbonate

sodium_carbonate:
