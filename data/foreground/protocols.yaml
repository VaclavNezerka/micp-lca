# Laboratory biocementation protocols reproduced from the papers (one specimen = the unit described).
# The foreground model scales every quantity to 1 kg of dry input solids and then to the functional unit.
#
# Keys
#   solids_g            dry solids per specimen (waste fines + additives)
#   gypsum_fraction     mass fraction of waste gypsum plaster in the solids
#   suspension          bacterial suspension in saline: volume_mL and od600
#   saline_mL           additional sterile saline (9 g/L NaCl)
#   hcl                 acid for pH adjustment: molarity (mol/L) and volume_mL (100 % HCl mass derived)
#   biocementation_solution (BS): base_medium (media.yaml id), supplements in g/L, dose_mL, dosing scheme
#       dosing: {mode: repeated, interval_h, duration_d}  -> n_doses = floor(duration_d*24/interval_h)
#               {mode: single}                            -> 1 dose at preparation
#               {mode: fixed, n_doses}                    -> explicit number
#   incubation          temperature_C and duration_d (biocementation period, wet)
#   drying              temperature_C and duration_d (conditioning/drying period)
#   results             measured properties of the consolidated specimen (null if not reported):
#       fc_MPa (uniaxial compressive strength), k_N_mm (indentation stiffness),
#       caco3_gain_wt_abs (absolute increase of CaCO3 in wt% vs sterile control), porosity_pct
#   precipitation_efficiency  fraction of the limiting reagent converted to CaCO3 (default 1.0);
#       when caco3_gain_wt_abs is given the measured value is used instead (measured_priority: true)
#   fibres_g            poultry feather fibres (dry mass) per specimen, if any

# ---------------------------------------------------------------- Sporosarcina pasteurii (ureolytic)
sp_wcf_14d:
  name: S. pasteurii DSM 33 on WCF, 14 d biocementation (HOLECEK2024 G-B-14 / H-B-14)
  source_id: HOLECEK2024
  strain: sporosarcina_pasteurii_DSM33
  material: wcf_h
  solids_g: 7.0
  gypsum_fraction: 0.0
  suspension: {volume_mL: 10.0, od600: 5.0}
  saline_mL: 10.0
  hcl: {molarity: 1.0, volume_mL: 0.7}
  biocementation_solution:
    base_medium: nb_4
    supplements: {urea: 20.0, calcium_chloride: 2.8}
    dose_mL: 10.0
    dosing: {mode: repeated, interval_h: 60, duration_d: 14}
  incubation: {temperature_C: 28, duration_d: 14}
  drying: {temperature_C: 28, duration_d: 30}
  results: {fc_MPa: null, k_N_mm: 5.01, caco3_gain_wt_abs: 1.6, porosity_pct: 61.8}
  precipitation_efficiency: 1.0

