# Waste fines stabilised in the papers, with the processing chain assumed for their preparation.
# All are secondary materials entering the system burden-free (EN 15804+A2, polluter-pays);
# only the processing after the end-of-waste point (crushing, milling, screening, transport) is included.
#
# processing steps: electricity_kWh_per_t (Czech grid), wear_parts_kg_per_t (chromium steel), notes
# transport_km: recycling yard -> biocementation plant (lorry); NEZERKA2023LCA used 52–70 km around Prague
# portlandite_wt: crystalline Ca(OH)2 available for carbonation (XRD); theoretical CO2 uptake = 0.5946 kg CO2 per kg Ca(OH)2
# caco3_wt: initial CaCO3 content (XRD, all polymorphs)
# product_bulk_density_kg_m3: bulk density of the consolidated (biocemented) product, used for per-m3 results

wcf_g:
  name: WCF-G – fines from a 3-year-old vibro-compacted concrete gutter (C12/15–C20/25), 0–0.25 mm fraction ground
  source_id: HOLECEK2024
  oxides_wt: {CaO: 35.62, SiO2: 36.66, Al2O3: 10.06, Fe2O3: 8.29, SO3: 1.67, MgO: 1.87, Na2O: 1.74, K2O: 3.00}
  portlandite_wt: 0.5
  caco3_wt: 29.57
  gypsum_wt: 0.0
  mean_particle_um: 5.08
  d90_um: 7.72
  processing:
    - {step: crushing, electricity_kWh_per_t: 1.5}
    - {step: high_speed_milling, electricity_kWh_per_t: 6.25, wear_parts_kg_per_t: 0.268, source_id: NEZERKA2023LCA}
    - {step: screening, electricity_kWh_per_t: 0.3}
  transport_km: 70
  product_bulk_density_kg_m3: 1100

